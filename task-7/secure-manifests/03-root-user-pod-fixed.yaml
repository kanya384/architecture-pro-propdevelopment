apiVersion: v1
kind: Pod
metadata:
  name: not-root-user-pod
  namespace: audit-zone
  labels:
    app: insecure
    violation: root-user
spec:
  containers:
  - name: alpine
    image: alpine:latest
    command: ["sleep", "3600"]
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ "ALL" ]
      seccompProfile:
        type: RuntimeDefault
  restartPolicy: Never